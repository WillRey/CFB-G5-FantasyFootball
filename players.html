<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Players | Walk-On Fantasy Football</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav></nav>

  <div class="container">
    <h1>Player Browser</h1>

    <div class="filters">
      <input type="text" id="search" placeholder="Search by name..." />
      <select id="conf-filter">
        <option value="">All Conferences</option>
        <option value="AAC">AAC</option>
        <option value="CUSA">C-USA</option>
        <option value="MAC">MAC</option>
        <option value="MWC">Mountain West</option>
        <option value="Pac-12">Pac-12</option>
        <option value="Sun Belt">Sun Belt</option>
      </select>
      <select id="pos-filter">
        <option value="">All Positions</option>
        <option value="QB">QB</option>
        <option value="RB">RB</option>
        <option value="WR">WR</option>
        <option value="TE">TE</option>
        <option value="K">K</option>
      </select>
      <select id="team-filter">
        <option value="">All Teams</option>
      </select>
    </div>

    <table id="player-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Position</th>
          <th>Team</th>
          <th>Conference</th>
          <th>Class</th>
        </tr>
      </thead>
      <tbody id="player-body"></tbody>
    </table>
  </div>

  <script type="module">
    import { initNav } from './nav.js';
    initNav('players.html');
  </script>

  <script>
    let allPlayers = [];

    fetch('g6_players_2026.csv')
      .then(res => res.text())
      .then(csv => {
        const lines = csv.trim().split('\n');
        const headers = lines[0].split(',');
        allPlayers = lines.slice(1).map(line => {
          const vals = line.split(',');
          const obj = {};
          headers.forEach((h, i) => obj[h.trim()] = (vals[i] || '').trim());
          return obj;
        }).filter(p => ['QB', 'RB', 'WR', 'TE', 'K', 'PK'].includes(p.position))
          .map(p => ({ ...p, position: p.position === 'PK' ? 'K' : p.position }));

        populateTeamDropdown();
        renderTable(allPlayers);
      });

    function getClassification(year) {
      const map = { '0': 'Freshman', '1': 'Sophomore', '2': 'Junior', '3': 'Senior', '4': 'Graduate' };
      return map[String(year)] || year || '—';
    }

    function populateTeamDropdown() {
      const teams = [...new Set(allPlayers.map(p => p.team))].sort();
      const select = document.getElementById('team-filter');
      teams.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        select.appendChild(opt);
      });
    }

    function renderTable(players) {
      const tbody = document.getElementById('player-body');
      tbody.innerHTML = '';
      players.slice(0, 100).forEach(p => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${p.firstName} ${p.lastName}</td>
          <td>${p.position}</td>
          <td>${p.team}</td>
          <td>${p.conference}</td>
          <td>${getClassification(p.year)}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function filterPlayers() {
      const search = document.getElementById('search').value.toLowerCase();
      const conf = document.getElementById('conf-filter').value;
      const pos = document.getElementById('pos-filter').value;
      const team = document.getElementById('team-filter').value;

      const filtered = allPlayers.filter(p => {
        const name = `${p.firstName} ${p.lastName}`.toLowerCase();
        return (
          (!search || name.includes(search)) &&
          (!conf || p.conference === conf) &&
          (!pos || p.position === pos) &&
          (!team || p.team === team)
        );
      });
      renderTable(filtered);
    }

    document.getElementById('search').addEventListener('input', filterPlayers);
    document.getElementById('conf-filter').addEventListener('change', filterPlayers);
    document.getElementById('pos-filter').addEventListener('change', filterPlayers);
    document.getElementById('team-filter').addEventListener('change', filterPlayers);
  </script>
</body>
</html>
