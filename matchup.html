<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Matchup | Walk-On Fantasy Football</title>
  <link type="image/png" sizes="16x16" rel="icon" href="/icons8-american-football-gradient-16.png">
<link type="image/png" sizes="32x32" rel="icon" href="/icons8-american-football-gradient-32.png">
<link type="image/png" sizes="96x96" rel="icon" href="/icons8-american-football-gradient-96.png">
  <link rel="stylesheet" href="style.css" />
  <style>
    .matchup-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding: 20px;
      background: #f8f9ff;
      border-radius: 10px;
      border: 1px solid #eee;
    }
    .matchup-header-team { flex: 1; }
    .matchup-header-team.home { text-align: right; }
    .matchup-header-team-name { font-size: 20px; font-weight: bold; }
    .matchup-header-team-manager { font-size: 13px; color: #888; }
    .matchup-header-score { text-align: center; min-width: 120px; }
    .matchup-header-score-value { font-size: 32px; font-weight: bold; color: #2a7ae2; }
    .matchup-header-score-label { font-size: 12px; color: #aaa; }
    .rosters-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .roster-section h3 { font-size: 16px; font-weight: bold; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 2px solid #eee; }
    .player-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f5f5f5; font-size: 14px; }
    .player-row-slot { font-size: 11px; font-weight: bold; color: white; background: #2a7ae2; padding: 2px 8px; border-radius: 4px; min-width: 50px; text-align: center; margin-right: 10px; }
    .player-row-info { flex: 1; }
    .player-row-name { font-weight: bold; }
    .player-row-details { font-size: 12px; color: #888; }
    .player-row-points { font-weight: bold; color: #2a7ae2; min-width: 50px; text-align: right; }
    .total-row { display: flex; justify-content: space-between; font-weight: bold; margin-top: 12px; padding-top: 8px; border-top: 2px solid #eee; }
    .back-link { display: inline-block; margin-bottom: 16px; color: #2a7ae2; cursor: pointer; font-size: 14px; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <nav></nav>

  <div class="container">
    <div class="back-link" onclick="history.back()">← Back to Scores</div>
    <div id="loading">Loading matchup...</div>
    <div id="matchup-content" style="display:none;"></div>
  </div>

  <script type="module">
    import { initNav, db, getLeagueId } from './nav.js';
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    initNav('matchup.html');

    const leagueId = getLeagueId();
    if (!leagueId) window.location.href = 'index.html';

    const params = new URLSearchParams(window.location.search);
    const week = parseInt(params.get('week')) || 1;
    const matchupIndex = parseInt(params.get('matchup')) || 0;

    let teams = [];

    const startingSlotDefs = [
      { label: 'QB', positions: ['QB'] },
      { label: 'RB', positions: ['RB'] },
      { label: 'RB', positions: ['RB'] },
      { label: 'WR', positions: ['WR'] },
      { label: 'WR', positions: ['WR'] },
      { label: 'TE', positions: ['TE'] },
      { label: 'Flex', positions: ['RB', 'WR', 'TE'] },
      { label: 'Flex', positions: ['RB', 'WR', 'TE'] },
      { label: 'K', positions: ['K'] },
      { label: 'D/ST', positions: ['DST'] },
    ];

    async function loadMatchup() {
      const [scheduleDoc, draftDoc] = await Promise.all([
        getDoc(doc(db, "schedule", leagueId)),
        getDoc(doc(db, "drafts", leagueId))
      ]);

      if (!scheduleDoc.exists() || !draftDoc.exists()) {
        document.getElementById('loading').textContent = 'Could not load matchup data.';
        return;
      }

      const schedule = scheduleDoc.data().weeks || [];
      teams = draftDoc.data().teams || [];
      const picks = draftDoc.data().picks || [];

      const weekData = schedule.find(w => w.week === week);
      if (!weekData) { document.getElementById('loading').textContent = 'Week not found.'; return; }

      const matchup = weekData.matchups[matchupIndex];
      if (!matchup) { document.getElementById('loading').textContent = 'Matchup not found.'; return; }

      const homeTeam = teams[matchup.home];
      const awayTeam = teams[matchup.away];
      const homePicks = picks.filter(p => p.teamIndex === matchup.home);
      const awayPicks = picks.filter(p => p.teamIndex === matchup.away);

      const homeLineup = buildLineup(homeTeam, homePicks);
      const awayLineup = buildLineup(awayTeam, awayPicks);

      document.getElementById('loading').style.display = 'none';
      document.getElementById('matchup-content').style.display = 'block';

      renderMatchup(homeTeam, awayTeam, homeLineup, awayLineup, matchup, week);
    }

    function buildLineup(team, picks) {
      if (team.lineup) return { starting: team.lineup.starting, bench: team.lineup.bench, mr: team.lineup.mr };

      const roster = [...picks];
      const starting = new Array(startingSlotDefs.length).fill(null);
      startingSlotDefs.forEach((slot, i) => {
        const idx = roster.findIndex(p => slot.positions.includes(p.position));
        if (idx !== -1) { starting[i] = roster[idx]; roster.splice(idx, 1); }
      });
      return { starting, bench: roster.slice(0, 7), mr: roster.slice(7, 9) };
    }

    function renderMatchup(homeTeam, awayTeam, homeLineup, awayLineup, matchup, week) {
      const el = document.getElementById('matchup-content');
      const hasScores = matchup.homeScore !== null && matchup.awayScore !== null;

      el.innerHTML = `
        <div style="font-size:13px;color:#888;margin-bottom:8px;">Week ${week}</div>
        <div class="matchup-header">
          <div class="matchup-header-team home">
            <div class="matchup-header-team-name">${homeTeam.name}</div>
            <div class="matchup-header-team-manager">${homeTeam.manager}</div>
          </div>
          <div class="matchup-header-score">
            ${hasScores
              ? `<div class="matchup-header-score-value">${matchup.homeScore} - ${matchup.awayScore}</div><div class="matchup-header-score-label">Final</div>`
              : `<div class="matchup-header-score-value" style="font-size:20px;color:#aaa;">vs</div><div class="matchup-header-score-label">Upcoming</div>`}
          </div>
          <div class="matchup-header-team">
            <div class="matchup-header-team-name">${awayTeam.name}</div>
            <div class="matchup-header-team-manager">${awayTeam.manager}</div>
          </div>
        </div>
        <div class="rosters-grid">
          <div class="roster-section">
            <h3>${homeTeam.name}</h3>
            ${renderRosterRows(homeLineup.starting, homeLineup.bench)}
          </div>
          <div class="roster-section">
            <h3>${awayTeam.name}</h3>
            ${renderRosterRows(awayLineup.starting, awayLineup.bench)}
          </div>
        </div>
      `;
    }

    function renderRosterRows(starting, bench) {
      let html = '';
      let totalPoints = 0;

      startingSlotDefs.forEach((slot, i) => {
        const player = starting[i];
        const pts = player?.weekPoints || null;
        if (pts) totalPoints += pts;
        html += `
          <div class="player-row">
            <span class="player-row-slot">${slot.label}</span>
            <div class="player-row-info">
              <div class="player-row-name">${player ? `${player.firstName} ${player.lastName}` : '—'}</div>
              <div class="player-row-details">${player ? `${player.position} · ${player.team}` : ''}</div>
            </div>
            <div class="player-row-points">${pts !== null ? pts.toFixed(1) : '—'}</div>
          </div>
        `;
      });

      html += `<div style="margin-top:12px;font-size:12px;font-weight:bold;color:#888;padding:4px 0;">BENCH</div>`;
      bench?.forEach(player => {
        if (!player) return;
        html += `
          <div class="player-row" style="opacity:0.6;">
            <span class="player-row-slot" style="background:#aaa;">BE</span>
            <div class="player-row-info">
              <div class="player-row-name">${player.firstName} ${player.lastName}</div>
              <div class="player-row-details">${player.position} · ${player.team}</div>
            </div>
            <div class="player-row-points">—</div>
          </div>
        `;
      });

      html += `<div class="total-row"><span>Total</span><span style="color:#2a7ae2;">${totalPoints > 0 ? totalPoints.toFixed(1) : '—'}</span></div>`;
      return html;
    }

    loadMatchup();
  </script>
  <footer>
  <a href="https://icons8.com/icon/american-football" target="_blank">American Football icon by Icons8</a>
</footer>
</body>
</html>
