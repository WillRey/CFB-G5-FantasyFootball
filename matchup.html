<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Matchup | Walk-On Fantasy Football</title>
  <link type="image/png" sizes="16x16" rel="icon" href="/icons8-american-football-gradient-16.png">
  <link type="image/png" sizes="32x32" rel="icon" href="/icons8-american-football-gradient-32.png">
  <link type="image/png" sizes="96x96" rel="icon" href="/icons8-american-football-gradient-96.png">
  <link rel="stylesheet" href="style.css" />
  <style>
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #1a6dff, #c822ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: opacity 0.15s;
    }
    .back-link:hover { opacity: 0.7; }

    .week-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      margin-bottom: 10px;
    }

    /* --- Matchup Header Card --- */
    .matchup-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
      padding: 24px;
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px rgba(26,109,255,0.10), 0 2px 8px rgba(200,34,255,0.06);
    }
    .matchup-header-team { flex: 1; }
    .matchup-header-team.home { text-align: right; }
    .matchup-header-team-name {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a2e;
    }
    .matchup-header-team-manager {
      font-size: 13px;
      color: #9ca3af;
      margin-top: 2px;
    }
    .matchup-header-score {
      text-align: center;
      min-width: 140px;
    }
    .matchup-header-score-value {
      font-size: 36px;
      font-weight: 700;
      background: linear-gradient(135deg, #1a6dff, #c822ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
    }
    .matchup-header-score-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      margin-top: 4px;
    }
    .matchup-vs {
      font-size: 22px;
      font-weight: 700;
      color: #d0d5e8;
    }

    /* --- Rosters Grid --- */
    .rosters-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .roster-section h3 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #374151;
      margin: 0 0 10px;
      padding-bottom: 8px;
      border-bottom: 1.5px solid #e8eaf0;
    }

    .player-row {
      display: flex;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f0f1f7;
      font-size: 14px;
      gap: 10px;
    }
    .player-row-slot {
      font-size: 11px;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #1a6dff, #c822ff);
      padding: 3px 8px;
      border-radius: 5px;
      min-width: 50px;
      text-align: center;
      flex-shrink: 0;
    }
    .player-row-slot.bench {
      background: #e8eaf0;
      color: #9ca3af;
    }
    .player-row-info { flex: 1; min-width: 0; }
    .player-row-name {
      font-weight: 600;
      color: #1a1a2e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-row-details { font-size: 12px; color: #9ca3af; margin-top: 1px; }
    .player-row-points {
      font-weight: 700;
      font-size: 14px;
      background: linear-gradient(135deg, #1a6dff, #c822ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      min-width: 40px;
      text-align: right;
      flex-shrink: 0;
    }
    .player-row-points.empty { color: #d0d5e8; -webkit-text-fill-color: #d0d5e8; background: none; }

    .bench-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #9ca3af;
      padding: 10px 0 4px;
    }
    .bench-row { opacity: 0.65; }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1.5px solid #e8eaf0;
      font-size: 15px;
    }
    .total-row-score {
      background: linear-gradient(135deg, #1a6dff, #c822ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    @media (max-width: 640px) {
      .rosters-grid { grid-template-columns: 1fr; }
      .matchup-header { flex-direction: column; text-align: center; }
      .matchup-header-team.home { text-align: center; }
    }
  </style>
</head>
<body>
  <nav></nav>

  <div class="container">
    <div class="back-link" onclick="history.back()">← Back to Scores</div>
    <div id="loading" style="color:#9ca3af;font-size:14px;">Loading matchup...</div>
    <div id="matchup-content" style="display:none;"></div>
  </div>

  <script type="module">
    import { initNav, db, getLeagueId } from './nav.js';
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    initNav('matchup.html');

    const leagueId = getLeagueId();
    if (!leagueId) window.location.href = 'index.html';

    const params = new URLSearchParams(window.location.search);
    const week = parseInt(params.get('week')) || 1;
    const matchupIndex = parseInt(params.get('matchup')) || 0;

    let teams = [];

    const startingSlotDefs = [
      { label: 'QB', positions: ['QB'] },
      { label: 'RB', positions: ['RB'] },
      { label: 'RB', positions: ['RB'] },
      { label: 'WR', positions: ['WR'] },
      { label: 'WR', positions: ['WR'] },
      { label: 'TE', positions: ['TE'] },
      { label: 'Flex', positions: ['RB', 'WR', 'TE'] },
      { label: 'Flex', positions: ['RB', 'WR', 'TE'] },
      { label: 'K', positions: ['K'] },
      { label: 'D/ST', positions: ['DST'] },
    ];

    async function loadMatchup() {
      const [scheduleDoc, draftDoc] = await Promise.all([
        getDoc(doc(db, "schedule", leagueId)),
        getDoc(doc(db, "drafts", leagueId))
      ]);

      if (!scheduleDoc.exists() || !draftDoc.exists()) {
        document.getElementById('loading').textContent = 'Could not load matchup data.';
        return;
      }

      const schedule = scheduleDoc.data().weeks || [];
      teams = draftDoc.data().teams || [];
      const picks = draftDoc.data().picks || [];

      const weekData = schedule.find(w => w.week === week);
      if (!weekData) { document.getElementById('loading').textContent = 'Week not found.'; return; }

      const matchup = weekData.matchups[matchupIndex];
      if (!matchup) { document.getElementById('loading').textContent = 'Matchup not found.'; return; }

      const homeTeam = teams[matchup.home];
      const awayTeam = teams[matchup.away];
      const homePicks = picks.filter(p => p.teamIndex === matchup.home);
      const awayPicks = picks.filter(p => p.teamIndex === matchup.away);

      const homeLineup = buildLineup(homeTeam, homePicks);
      const awayLineup = buildLineup(awayTeam, awayPicks);

      document.getElementById('loading').style.display = 'none';
      document.getElementById('matchup-content').style.display = 'block';

      renderMatchup(homeTeam, awayTeam, homeLineup, awayLineup, matchup, week);
    }

    function buildLineup(team, picks) {
      if (team.lineup) return { starting: team.lineup.starting, bench: team.lineup.bench, mr: team.lineup.mr };
      const roster = [...picks];
      const starting = new Array(startingSlotDefs.length).fill(null);
      startingSlotDefs.forEach((slot, i) => {
        const idx = roster.findIndex(p => slot.positions.includes(p.position));
        if (idx !== -1) { starting[i] = roster[idx]; roster.splice(idx, 1); }
      });
      return { starting, bench: roster.slice(0, 7), mr: roster.slice(7, 9) };
    }

    function renderMatchup(homeTeam, awayTeam, homeLineup, awayLineup, matchup, week) {
      const el = document.getElementById('matchup-content');
      const hasScores = matchup.homeScore !== null && matchup.awayScore !== null;

      el.innerHTML = `
        <div class="week-label">Week ${week}</div>
        <div class="matchup-header">
          <div class="matchup-header-team home">
            <div class="matchup-header-team-name">${homeTeam.name}</div>
            <div class="matchup-header-team-manager">${homeTeam.manager}</div>
          </div>
          <div class="matchup-header-score">
            ${hasScores
              ? `<div class="matchup-header-score-value">${matchup.homeScore} – ${matchup.awayScore}</div>
                 <div class="matchup-header-score-label">Final</div>`
              : `<div class="matchup-vs">vs</div>
                 <div class="matchup-header-score-label">Upcoming</div>`}
          </div>
          <div class="matchup-header-team">
            <div class="matchup-header-team-name">${awayTeam.name}</div>
            <div class="matchup-header-team-manager">${awayTeam.manager}</div>
          </div>
        </div>
        <div class="rosters-grid">
          <div class="roster-section">
            <h3>${homeTeam.name}</h3>
            ${renderRosterRows(homeLineup.starting, homeLineup.bench)}
          </div>
          <div class="roster-section">
            <h3>${awayTeam.name}</h3>
            ${renderRosterRows(awayLineup.starting, awayLineup.bench)}
          </div>
        </div>
      `;
    }

    function renderRosterRows(starting, bench) {
      let html = '';
      let totalPoints = 0;

      startingSlotDefs.forEach((slot, i) => {
        const player = starting[i];
        const pts = player?.weekPoints || null;
        if (pts) totalPoints += pts;
        html += `
          <div class="player-row">
            <span class="player-row-slot">${slot.label}</span>
            <div class="player-row-info">
            <div class="player-row-name">${player ? (player.position === 'DST' ? player.lastName : `${player.firstName} ${player.lastName}`) : '—'}</div>
            <div class="player-row-details">${player ? `${player.position === 'DST' ? 'D/ST' : player.position} · ${player.team}` : ''}</div>
            </div>
            <div class="player-row-points ${pts === null ? 'empty' : ''}">${pts !== null ? pts.toFixed(1) : '—'}</div>
          </div>
        `;
      });

      html += `<div class="bench-label">Bench</div>`;
      bench?.forEach(player => {
        if (!player) return;
        html += `
          <div class="player-row bench-row">
            <span class="player-row-slot bench">BE</span>
            <div class="player-row-info">
              <div class="player-row-name">${player.firstName} ${player.lastName}</div>
              <div class="player-row-details">${player.position} · ${player.team}</div>
            </div>
            <div class="player-row-points empty">—</div>
          </div>
        `;
      });

      html += `
        <div class="total-row">
          <span>Total</span>
          <span class="total-row-score">${totalPoints > 0 ? totalPoints.toFixed(1) : '—'}</span>
        </div>
      `;
      return html;
    }

    loadMatchup();
  </script>

  <footer>
    <a href="https://icons8.com/icons/set/american-football" target="_blank" rel="noopener">American Football icon by Icons8</a>
  </footer>
</body>
</html>
