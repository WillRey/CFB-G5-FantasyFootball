<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scores | Walk-On Fantasy Football</title>
  <link type="image/png" sizes="16x16" rel="icon" href="/icons8-american-football-gradient-16.png">
  <link type="image/png" sizes="32x32" rel="icon" href="/icons8-american-football-gradient-32.png">
  <link type="image/png" sizes="96x96" rel="icon" href="/icons8-american-football-gradient-96.png">
  <link rel="stylesheet" href="style.css" />
  <style>
    /* --- Week Selector --- */
    .week-selector {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .week-btn {
      padding: 6px 14px;
      border: 1px solid #d0d5e8;
      border-radius: 8px;
      cursor: pointer;
      background: rgba(255,255,255,0.75);
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      transition: all 0.15s;
      backdrop-filter: blur(6px);
    }
    .week-btn:hover {
      border-color: #1a6dff;
      color: #1a6dff;
    }
    .week-btn.active {
      background: linear-gradient(135deg, #1a6dff, #c822ff);
      border-color: transparent;
      color: white;
    }
    .week-btn.playoff {
      border-color: #f59e0b;
      color: #f59e0b;
    }
    .week-btn.playoff.active {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border-color: transparent;
      color: white;
    }

    /* --- Week Label --- */
    .week-label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #374151;
      margin-bottom: 14px;
    }

    .playoff-badge {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }

    /* --- Matchup Cards --- */
    .matchup-card {
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 12px;
      padding: 18px 24px;
      margin-bottom: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      backdrop-filter: blur(8px);
      transition: box-shadow 0.15s, transform 0.1s;
    }
    .matchup-card:hover {
      box-shadow: 0 8px 24px rgba(26,109,255,0.12), 0 2px 8px rgba(200,34,255,0.06);
      transform: translateY(-1px);
    }

    .matchup-team { flex: 1; }
    .matchup-team.home { text-align: right; }
    .matchup-team-name {
      font-weight: 700;
      font-size: 16px;
      color: #1a1a2e;
    }
    .matchup-team-manager {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 2px;
    }

    .matchup-score {
      text-align: center;
      min-width: 100px;
    }
    .matchup-score-value {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #1a6dff, #c822ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
    }
    .matchup-score-final {
      font-size: 11px;
      font-weight: 600;
      color: #22c55e;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 3px;
    }
    .matchup-score-vs {
      font-size: 16px;
      font-weight: 700;
      color: #d0d5e8;
    }

    .bye-team {
      font-size: 13px;
      color: #9ca3af;
      margin-top: 12px;
      padding: 10px 16px;
      background: rgba(255,255,255,0.5);
      border-radius: 8px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <nav></nav>

  <div class="container">
    <h1>Scores</h1>
    <div id="loading" style="color:#9ca3af;font-size:14px;">Loading schedule...</div>
    <div id="scores-content" style="display:none;">
      <div class="week-selector" id="week-selector"></div>
      <div id="week-display"></div>
    </div>
    <div id="no-schedule" style="display:none;">
      <p style="color:#6b7280;">No schedule found. Ask your Athletic Director to generate one on the <a href="schedule.html">Schedule page</a>.</p>
    </div>
  </div>

  <script type="module">
    import { initNav, db, getLeagueId } from './nav.js';
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    initNav('scores.html');

    const leagueId = getLeagueId();

    let teams = [];
    let schedule = [];
    let currentWeek = 1;

    async function loadSchedule() {
      if (!leagueId) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('no-schedule').style.display = 'block';
        return;
      }

      const [scheduleDoc, draftDoc] = await Promise.all([
        getDoc(doc(db, "schedule", leagueId)),
        getDoc(doc(db, "drafts", leagueId))
      ]);

      if (!scheduleDoc.exists() || !draftDoc.exists()) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('no-schedule').style.display = 'block';
        return;
      }

      teams = draftDoc.data().teams || [];
      schedule = scheduleDoc.data().weeks || [];

      // Load logos for each team by uid
      const logoMap = {};
      await Promise.all(teams.map(async t => {
        if (!t.uid) return;
        try {
          const userDoc = await getDoc(doc(db, "users", t.uid));
          if (userDoc.exists()) logoMap[t.uid] = userDoc.data().logoUrl || null;
        } catch (e) {}
      }));
      window.logoMap = logoMap;

      // Build record map for all teams
      const recordMap = {};
      teams.forEach((t, i) => { recordMap[i] = { wins: 0, losses: 0 }; });
      schedule.filter(w => !w.playoff && w.week <= 11).forEach(week => {
        (week.matchups || []).forEach(m => {
          if (m.homeScore === null || m.awayScore === null) return;
          if (m.homeScore > m.awayScore) {
            recordMap[m.home].wins++;
            recordMap[m.away].losses++;
          } else if (m.awayScore > m.homeScore) {
            recordMap[m.away].wins++;
            recordMap[m.home].losses++;
          } else {
            recordMap[m.home].ties = (recordMap[m.home].ties || 0) + 1;
            recordMap[m.away].ties = (recordMap[m.away].ties || 0) + 1;
          }
        });
      });
      window.recordMap = recordMap;

      document.getElementById('loading').style.display = 'none';
      document.getElementById('scores-content').style.display = 'block';

      currentWeek = getCurrentWeek();
      renderWeekSelector();
      renderWeek(currentWeek);
    }

    function getCurrentWeek() {
      const seasonStart = new Date('2026-09-03');
      const now = new Date();
      const diff = Math.floor((now - seasonStart) / (7 * 24 * 60 * 60 * 1000));
      return Math.min(Math.max(diff + 1, 1), 13);
    }

    function renderWeekSelector() {
      const el = document.getElementById('week-selector');
      el.innerHTML = '';
      schedule.forEach(weekData => {
        const btn = document.createElement('button');
        btn.className = `week-btn ${weekData.playoff ? 'playoff' : ''} ${weekData.week === currentWeek ? 'active' : ''}`;
        btn.textContent = weekData.playoff
          ? (weekData.type === 'semifinals' ? 'Semis' : 'Champ')
          : `Wk ${weekData.week}`;
        btn.onclick = () => {
          currentWeek = weekData.week;
          document.querySelectorAll('.week-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderWeek(currentWeek);
        };
        el.appendChild(btn);
      });
    }

    function renderWeek(week) {
      const weekData = schedule.find(w => w.week === week);
      if (!weekData) return;

      const el = document.getElementById('week-display');
      el.innerHTML = '';

      const label = weekData.type === 'regular' ? `Week ${week}`
        : weekData.type === 'semifinals' ? 'Semifinals' : 'Championship';

      el.innerHTML = `<div class="week-label">${label}</div>`;

      if (weekData.playoff && !weekData.matchups?.length) {
        el.innerHTML += `<span class="playoff-badge">Playoffs</span><p style="color:#9ca3af;font-size:14px;margin-top:8px;">Playoff matchups set after regular season.</p>`;
        return;
      }
      if (weekData.playoff) {
        el.innerHTML += `<span class="playoff-badge">Playoffs</span>`;
      }

      weekData.matchups.forEach((matchup, i) => {
        const homeTeam = teams[matchup.home];
        const awayTeam = teams[matchup.away];
        if (!homeTeam || !awayTeam) return;

        const hasScores = matchup.homeScore !== null && matchup.awayScore !== null;
        const card = document.createElement('div');
        card.className = 'matchup-card';
        card.onclick = () => { window.location.href = `matchup.html?week=${week}&matchup=${i}`; };
        const homeLogo = window.logoMap?.[homeTeam.uid];
        const awayLogo = window.logoMap?.[awayTeam.uid];
        card.innerHTML = `
          <div class="matchup-team home">
            <div class="matchup-team-name">${homeTeam.name}</div>
            <div class="matchup-team-manager">${homeTeam.manager}</div>
            <div class="matchup-team-manager">(${window.recordMap?.[matchup.home]?.wins ?? 0}-${window.recordMap?.[matchup.home]?.losses ?? 0}${window.recordMap?.[matchup.home]?.ties ? `-${window.recordMap[matchup.home].ties}` : ''})</div>
          </div>
          ${homeLogo ? `<img src="${homeLogo}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid #e8eaf0;;" />` : '<div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#eef3ff,#faf0ff);border:1px solid #c8d8ff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#1a6dff;">' + (homeTeam.name?.[0] || '?') + '</div>'}
          <div class="matchup-score">
            ${hasScores
              ? `<div class="matchup-score-value">${matchup.homeScore} – ${matchup.awayScore}</div>
                 <div class="matchup-score-final">Final</div>`
              : `<div class="matchup-score-vs">vs</div>`}
          </div>
          ${awayLogo ? `<img src="${awayLogo}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid #e8eaf0;" />` : '<div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#eef3ff,#faf0ff);border:1px solid #c8d8ff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#1a6dff;">' + (awayTeam.name?.[0] || '?') + '</div>'}
          <div class="matchup-team">
            <div class="matchup-team-name">${awayTeam.name}</div>
            <div class="matchup-team-manager">${awayTeam.manager}</div>
            <div class="matchup-team-manager">(${window.recordMap?.[matchup.away]?.wins ?? 0}-${window.recordMap?.[matchup.away]?.losses ?? 0}${window.recordMap?.[matchup.away]?.ties ? `-${window.recordMap[matchup.away].ties}` : ''})</div>
          </div>
        `;
        el.appendChild(card);
      });

      if (weekData.bye !== null && weekData.bye !== undefined) {
        const byeName = teams[weekData.bye]?.name || `Team ${weekData.bye + 1}`;
        el.innerHTML += `<p class="bye-team">Bye week: ${byeName}</p>`;
      }
    }

    loadSchedule();
    setInterval(() => loadSchedule(), 5 * 60 * 1000);
  </script>

  <footer>
    <a href="https://icons8.com/icons/set/american-football" target="_blank" rel="noopener">American Football icon by Icons8</a>
  </footer>
</body>
</html>
