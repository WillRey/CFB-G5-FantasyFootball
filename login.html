<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Walk-On Fantasy Football</title>
  <link type="image/png" sizes="16x16" rel="icon" href="/icons8-american-football-gradient-16.png">
<link type="image/png" sizes="32x32" rel="icon" href="/icons8-american-football-gradient-32.png">
<link type="image/png" sizes="96x96" rel="icon" href="/icons8-american-football-gradient-96.png">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav></nav>

  <div class="container">
    <h1>Walk-On Fantasy Football</h1>

    <div id="login-box">
      <h2>Sign In</h2>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="Enter your email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Enter your password" />
      </div>
      <button onclick="signIn()">Sign In</button>
      <p id="login-error" style="color:red;display:none;"></p>
      <p style="margin-top:12px;font-size:14px;">New here? <a href="#" onclick="toggleRegister()">Create an account</a></p>
    </div>

    <div id="register-box" style="display:none;">
      <h2>Create Your Account</h2>
      <div class="form-group">
        <label>First Name</label>
        <input type="text" id="register-first" placeholder="First name" />
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="register-last" placeholder="Last name" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="register-email" placeholder="Enter your email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="register-password" placeholder="Choose a password" />
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="register-confirm" placeholder="Confirm your password" />
      </div>
      <button onclick="register()">Create Account</button>
      <p id="register-error" style="color:red;display:none;"></p>
      <p style="margin-top:12px;font-size:14px;">Already have an account? <a href="#" onclick="toggleRegister()">Sign in</a></p>
    </div>
  </div>

  <script type="module">
    import { initNav, auth } from './nav.js';
    import { signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    initNav('login.html');

    onAuthStateChanged(auth, user => {
      if (user) window.location.href = 'myteam.html';
    });

    window.signIn = async function() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errorEl = document.getElementById('login-error');
      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'myteam.html';
      } catch (err) {
        errorEl.textContent = 'Invalid email or password. Please try again.';
        errorEl.style.display = 'block';
      }
    }

    window.register = async function() {
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;
      const confirm = document.getElementById('register-confirm').value;
      const firstName = document.getElementById('register-first').value.trim();
      const lastName = document.getElementById('register-last').value.trim();
      const errorEl = document.getElementById('register-error');

      if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.style.display = 'block';
        return;
      }

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(userCredential.user, { displayName: `${firstName} ${lastName}` });
        window.location.href = 'myteam.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    }

    window.toggleRegister = function() {
      const loginBox = document.getElementById('login-box');
      const registerBox = document.getElementById('register-box');
      loginBox.style.display = loginBox.style.display === 'none' ? 'block' : 'none';
      registerBox.style.display = registerBox.style.display === 'none' ? 'block' : 'none';
    }
  </script>
<footer>
  <a href="https://icons8.com/icons/set/american-football" target="_blank">American Football icon by Icons8</a>
</footer>
</body>
</html>
