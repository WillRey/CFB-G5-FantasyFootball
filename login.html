<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Walk-On Fantasy Football</title>
  <link type="image/png" sizes="16x16" rel="icon" href="/icons8-american-football-gradient-16.png">
  <link type="image/png" sizes="32x32" rel="icon" href="/icons8-american-football-gradient-32.png">
  <link type="image/png" sizes="96x96" rel="icon" href="/icons8-american-football-gradient-96.png">
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-wrap {
      max-width: 440px;
      margin: 2rem auto 0;
    }
    .auth-card {
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 14px;
      padding: 2rem;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px rgba(26,109,255,0.10), 0 2px 8px rgba(200,34,255,0.06);
    }
    .auth-card h2 {
      margin: 0 0 1.5rem;
      font-size: 20px;
      font-weight: 700;
      color: #1a1a2e;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d0d5e8;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
      background: rgba(255,255,255,0.9);
      box-sizing: border-box;
    }
    .form-group input:focus { border-color: #1a6dff; }
    .btn-auth {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #1a6dff, #c822ff);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-top: 4px;
    }
    .btn-auth:hover { opacity: 0.88; }
    .auth-error {
      color: #ef4444;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }
    .auth-toggle {
      margin-top: 16px;
      font-size: 14px;
      color: #6b7280;
      text-align: center;
    }
    .auth-toggle a {
      font-weight: 600;
      background: linear-gradient(135deg, #1a6dff, #c822ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>
</head>
<body>
  <nav></nav>

  <div class="container">
    <div style="text-align:center;padding:2rem 0 0;">
      <h1>Walk-On Fantasy Football</h1>
    </div>

    <div class="auth-wrap">
      <div class="auth-card" id="login-box">
        <h2>Sign in</h2>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Your password" />
        </div>
        <button class="btn-auth" onclick="signIn()">Sign in</button>
        <p class="auth-error" id="login-error"></p>
        <p class="auth-toggle">New here? <a href="#" onclick="toggleRegister()">Create an account</a></p>
      </div>

      <div class="auth-card" id="register-box" style="display:none;">
        <h2>Create your account</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div class="form-group">
            <label>First name</label>
            <input type="text" id="register-first" placeholder="First" />
          </div>
          <div class="form-group">
            <label>Last name</label>
            <input type="text" id="register-last" placeholder="Last" />
          </div>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="register-email" placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="register-password" placeholder="Choose a password" />
        </div>
        <div class="form-group">
          <label>Confirm password</label>
          <input type="password" id="register-confirm" placeholder="Confirm your password" />
        </div>
        <button class="btn-auth" onclick="register()">Create account</button>
        <p class="auth-error" id="register-error"></p>
        <p class="auth-toggle">Already have an account? <a href="#" onclick="toggleRegister()">Sign in</a></p>
      </div>
    </div>
  </div>

  <script type="module">
    import { initNav, auth } from './nav.js';
    import { signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    initNav('login.html');

    onAuthStateChanged(auth, user => {
      if (user) window.location.href = 'myteam.html';
    });

    window.signIn = async function() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errorEl = document.getElementById('login-error');
      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'myteam.html';
      } catch (err) {
        errorEl.textContent = 'Invalid email or password. Please try again.';
        errorEl.style.display = 'block';
      }
    }

    window.register = async function() {
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;
      const confirm = document.getElementById('register-confirm').value;
      const firstName = document.getElementById('register-first').value.trim();
      const lastName = document.getElementById('register-last').value.trim();
      const errorEl = document.getElementById('register-error');

      if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.style.display = 'block';
        return;
      }

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(userCredential.user, { displayName: `${firstName} ${lastName}` });
        window.location.href = 'myteam.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    }

    window.toggleRegister = function() {
      const loginBox = document.getElementById('login-box');
      const registerBox = document.getElementById('register-box');
      loginBox.style.display = loginBox.style.display === 'none' ? 'block' : 'none';
      registerBox.style.display = registerBox.style.display === 'none' ? 'block' : 'none';
    }
  </script>

  <footer>
    <a href="https://icons8.com/icons/set/american-football" target="_blank" rel="noopener">American Football icon by Icons8</a>
  </footer>
</body>
</html>
