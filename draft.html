<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signing Day | Walk-On Fantasy Football</title>
  <link type="image/png" sizes="16x16" rel="icon" href="/icons8-american-football-gradient-16.png">
  <link type="image/png" sizes="32x32" rel="icon" href="/icons8-american-football-gradient-32.png">
  <link type="image/png" sizes="96x96" rel="icon" href="/icons8-american-football-gradient-96.png">
  <link rel="stylesheet" href="style.css" />
  <style>
    /* --- Draft Order Strip --- */
    #draft-order-strip {
      overflow-x: auto;
      white-space: nowrap;
      padding: 12px 0;
      border-bottom: 1.5px solid #e8eaf0;
      margin-bottom: 20px;
    }
    #pick-list { display: inline-flex; gap: 8px; }
    .pick-chip {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 14px;
      border: 1px solid #e8eaf0;
      border-radius: 8px;
      font-size: 12px;
      min-width: 80px;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(6px);
    }
    .pick-chip.current {
      background: linear-gradient(135deg, #1a6dff, #c822ff);
      color: white;
      border-color: transparent;
    }
    .pick-label { font-weight: 700; }
    .pick-team { font-size: 11px; opacity: 0.85; }

    /* --- Draft Status --- */
    #draft-status {
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(26,109,255,0.08);
    }
    #draft-status h2 {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 700;
      color: #1a1a2e;
    }
    #draft-status p {
      margin: 0 0 8px;
      font-size: 14px;
      color: #6b7280;
    }
    #timer-display {
      font-size: 48px;
      font-weight: 700;
      background: linear-gradient(135deg, #1a6dff, #c822ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    /* --- Draft Layout --- */
    #draft-main {
      display: flex;
      gap: 24px;
      margin-top: 20px;
    }
    #player-pool { flex: 2; }
    #my-roster-panel {
      min-width: 220px;
      flex: 1;
    }

    /* --- Filters --- */
    .draft-filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .draft-filters input,
    .draft-filters select {
      padding: 7px 12px;
      border: 1px solid #d0d5e8;
      border-radius: 8px;
      font-size: 13px;
      background: rgba(255,255,255,0.8);
      outline: none;
      transition: border-color 0.15s;
    }
    .draft-filters input:focus,
    .draft-filters select:focus { border-color: #1a6dff; }

    /* --- Player Table --- */
    #draft-player-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    #draft-player-table thead th {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #4b5563;
      padding: 8px 12px;
      border-bottom: 1.5px solid #e8eaf0;
      text-align: left;
    }
    #draft-player-table tbody tr {
      border-bottom: 1px solid #f0f1f7;
      transition: background 0.12s;
    }
    #draft-player-table tbody tr:hover { background: rgba(26,109,255,0.03); }
    #draft-player-table tbody td {
      padding: 8px 12px;
      color: #1a1a2e;
    }

    .btn-sign {
      padding: 5px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      border: none;
      background: linear-gradient(135deg, #1a6dff, #c822ff);
      color: white;
      transition: opacity 0.15s;
    }
    .btn-sign:hover { opacity: 0.85; }

    /* --- My Roster Panel --- */
    #my-roster-panel h3 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #374151;
      margin: 0 0 10px;
      padding-bottom: 8px;
      border-bottom: 1.5px solid #e8eaf0;
    }
    .roster-slot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid #f0f1f7;
      font-size: 13px;
    }
    .slot-label {
      font-size: 11px;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #1a6dff, #c822ff);
      padding: 3px 8px;
      border-radius: 5px;
      min-width: 60px;
      text-align: center;
      flex-shrink: 0;
    }
    .roster-slot.empty .slot-player { color: #9ca3af; }
    .roster-slot.filled .slot-player { font-weight: 600; color: #1a1a2e; }
    .slot-player { margin-left: 10px; flex: 1; }

    /* --- All Rosters --- */
    #team-rosters { margin-top: 30px; }
    #team-rosters h3 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #374151;
      margin: 0 0 12px;
    }
    #roster-display { display: flex; flex-wrap: wrap; gap: 16px; }
    .roster-card {
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 12px;
      padding: 14px 18px;
      min-width: 180px;
      backdrop-filter: blur(6px);
    }
    .roster-card h4 {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 700;
      color: #1a1a2e;
    }
    .roster-card ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .roster-card ul li {
      font-size: 12px;
      color: #6b7280;
      padding: 3px 0;
      border-bottom: 1px solid #f0f1f7;
    }
    .roster-card ul li:last-child { border-bottom: none; }

    /* --- Setup Form --- */
    #draft-setup {
      max-width: 680px;
    }
    #draft-setup h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    #draft-setup p {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .team-input-row {
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      backdrop-filter: blur(6px);
    }
    .team-input-row strong {
      font-size: 13px;
      font-weight: 700;
      color: #374151;
      display: block;
      margin-bottom: 8px;
    }
    .team-input-row input {
      padding: 7px 12px;
      border: 1px solid #d0d5e8;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
      margin-right: 8px;
      margin-bottom: 4px;
    }
    .team-input-row input:focus { border-color: #1a6dff; }

    .btn-start {
      margin-top: 16px;
      padding: 11px 28px;
      background: linear-gradient(135deg, #1a6dff, #c822ff);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-start:hover { opacity: 0.88; }
  </style>
</head>
<body>
  <nav></nav>

  <div class="container">
    <h1>Signing Day</h1>

    <div id="draft-setup">
      <h2>Team Setup</h2>
      <p>Enter each team name, manager name, and email before starting Signing Day.</p>
      <div id="team-inputs"></div>
      <button class="btn-start" onclick="startDraft()">Start Signing Day</button>
    </div>

    <div id="draft-board" style="display:none;">
      <div id="draft-order-strip">
        <div id="pick-list"></div>
      </div>

      <div id="draft-status">
        <h2 id="current-pick-label">Round 1 | Pick 1</h2>
        <p id="current-team-label">On the clock:</p>
        <div id="timer-display">2:00</div>
      </div>

      <div id="draft-main">
        <div id="player-pool">
          <div class="draft-filters">
            <input type="text" id="draft-search" placeholder="Search players..." oninput="filterDraftPlayers()" />
            <select id="draft-pos-filter" onchange="filterDraftPlayers()">
              <option value="">All Positions</option>
              <option value="QB">QB</option>
              <option value="RB">RB</option>
              <option value="WR">WR</option>
              <option value="TE">TE</option>
              <option value="K">K</option>
            </select>
            <select id="draft-conf-filter" onchange="filterDraftPlayers()">
              <option value="">All Conferences</option>
              <option value="AAC">AAC</option>
              <option value="CUSA">C-USA</option>
              <option value="MAC">MAC</option>
              <option value="MWC">Mountain West</option>
              <option value="Pac-12">Pac-12</option>
              <option value="Sun Belt">Sun Belt</option>
            </select>
            <select id="draft-team-filter" onchange="filterDraftPlayers()">
              <option value="">All Teams</option>
            </select>
          </div>
          <table id="draft-player-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Position</th>
                <th>Team</th>
                <th>Conference</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="draft-player-body"></tbody>
          </table>
        </div>

        <div id="my-roster-panel">
          <h3 id="my-roster-title">My Roster</h3>
          <div id="my-roster-slots"></div>
        </div>
      </div>

      <div id="team-rosters">
        <h3>All Team Rosters</h3>
        <div id="roster-display"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initNav, db, getLeagueId } from './nav.js';
    import { doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    initNav('draft.html');

    const leagueId = getLeagueId();
    if (!leagueId) window.location.href = 'index.html';

    const league = JSON.parse(localStorage.getItem('leagueData')) || { teams: 8, roster: '1QB' };
    let teamCount = parseInt(league.teams);

    const rosterSlots = league.roster === 'Superflex'
      ? ['QB', 'RB', 'RB', 'WR', 'WR', 'TE', 'Flex', 'Flex', 'Superflex', 'K', 'DST', 'Bench', 'Bench', 'Bench', 'Bench', 'Bench', 'Bench', 'Bench', 'MR', 'MR']
      : ['QB', 'RB', 'RB', 'WR', 'WR', 'TE', 'Flex', 'Flex', 'K', 'DST', 'Bench', 'Bench', 'Bench', 'Bench', 'Bench', 'Bench', 'Bench', 'MR', 'MR'];

    const totalRounds = rosterSlots.length;
    let teams = [];
    let allPlayers = [];
    let availablePlayers = [];
    let draftedPlayers = [];
    let currentPick = 0;
    let totalPicks = 0;
    let timerInterval = null;
    let secondsLeft = 120;
    let draftData = null;

    const teamInputs = document.getElementById('team-inputs');
    for (let i = 0; i < teamCount; i++) {
      const div = document.createElement('div');
      div.className = 'team-input-row';
      div.innerHTML = `
        <strong>Team ${i + 1}</strong>
        <input type="text" id="team-name-${i}" placeholder="Team name" />
        <input type="text" id="manager-name-${i}" placeholder="Manager name" />
        <input type="email" id="manager-email-${i}" placeholder="Manager email" />
      `;
      teamInputs.appendChild(div);
    }

    fetch('g6_players_2026.csv')
      .then(res => res.text())
      .then(csv => {
        const lines = csv.trim().split('\n');
        const headers = lines[0].split(',');
        allPlayers = lines.slice(1).map(line => {
          const vals = line.split(',');
          const obj = {};
          headers.forEach((h, i) => obj[h.trim()] = (vals[i] || '').trim());
          return obj;
        }).filter(p => ['QB', 'RB', 'WR', 'TE', 'K', 'PK'].includes(p.position))
          .map(p => ({ ...p, position: p.position === 'PK' ? 'K' : p.position }));

        availablePlayers = [...allPlayers];
        checkExistingDraft();
      });

    async function checkExistingDraft() {
      const draftDoc = await getDoc(doc(db, "drafts", leagueId));
      if (draftDoc.exists()) {
        draftData = draftDoc.data();
        teams = draftData.teams;
        teamCount = teams.length;

        draftedPlayers = draftData.picks || [];
        draftedPlayers.forEach(pick => {
          const idx = availablePlayers.findIndex(p =>
            p.firstName === pick.firstName && p.lastName === pick.lastName && p.team === pick.team
          );
          if (idx !== -1) availablePlayers.splice(idx, 1);
          if (teams[pick.teamIndex]) teams[pick.teamIndex].roster.push(pick);
        });

        currentPick = draftedPlayers.length;
        window.draftOrder = buildSnakeOrder(teamCount, totalRounds);
        totalPicks = window.draftOrder.length;

        document.getElementById('draft-setup').style.display = 'none';
        document.getElementById('draft-board').style.display = 'block';

        renderPickList();
        renderRosters();
        renderAvailablePlayers();
        populateTeamFilter();
        startTurn();
        listenForPicks();
      }
    }

    function buildSnakeOrder(teamCount, totalRounds) {
      const order = [];
      for (let r = 0; r < totalRounds; r++) {
        const round = Array.from({ length: teamCount }, (_, i) => i);
        if (r % 2 === 1) round.reverse();
        order.push(...round);
      }
      return order;
    }

    window.startDraft = async function() {
      teams = [];
      for (let i = 0; i < teamCount; i++) {
        const name = document.getElementById(`team-name-${i}`).value || `Team ${i + 1}`;
        const manager = document.getElementById(`manager-name-${i}`).value || `Manager ${i + 1}`;
        const email = document.getElementById(`manager-email-${i}`).value || '';
        teams.push({ name, manager, email, roster: [] });
      }

      window.draftOrder = buildSnakeOrder(teamCount, totalRounds);
      totalPicks = window.draftOrder.length;
      currentPick = 0;

      draftData = {
        teams: teams.map(t => ({ name: t.name, manager: t.manager, email: t.email, roster: [] })),
        picks: [],
        currentPick: 0,
        started: true,
        leagueId,
        createdAt: new Date().toISOString()
      };

      await setDoc(doc(db, "drafts", leagueId), draftData);

      document.getElementById('draft-setup').style.display = 'none';
      document.getElementById('draft-board').style.display = 'block';

      renderPickList();
      renderRosters();
      renderAvailablePlayers();
      populateTeamFilter();
      startTurn();
      listenForPicks();
    }

    function listenForPicks() {
      onSnapshot(doc(db, "drafts", leagueId), (snapshot) => {
        if (!snapshot.exists()) return;
        const data = snapshot.data();
        const newPickCount = data.picks ? data.picks.length : 0;

        if (newPickCount !== draftedPlayers.length) {
          draftedPlayers = data.picks || [];
          availablePlayers = allPlayers.filter(p =>
            !draftedPlayers.find(d => d.firstName === p.firstName && d.lastName === p.lastName && d.team === p.team)
          );
          teams.forEach(t => t.roster = []);
          draftedPlayers.forEach(pick => {
            if (teams[pick.teamIndex]) teams[pick.teamIndex].roster.push(pick);
          });

          currentPick = newPickCount;
          draftData = data;
          clearInterval(timerInterval);
          renderPickList();
          renderRosters();
          renderAvailablePlayers();
          startTurn();
        }
      });
    }

    function startTurn() {
      if (currentPick >= totalPicks) {
        document.getElementById('current-pick-label').textContent = 'Signing Day Complete!';
        document.getElementById('current-team-label').textContent = 'Redirecting to your team...';
        document.getElementById('timer-display').textContent = '';
        clearInterval(timerInterval);
        setTimeout(() => { window.location.href = 'myteam.html'; }, 3000);
        return;
      }

      const teamIndex = window.draftOrder[currentPick];
      const round = Math.floor(currentPick / teamCount) + 1;
      const pick = (currentPick % teamCount) + 1;

      document.getElementById('current-pick-label').textContent = `Round ${round} | Pick ${pick}`;
      document.getElementById('current-team-label').textContent =
        `On the clock: ${teams[teamIndex].name} (${teams[teamIndex].manager})`;

      secondsLeft = 120;
      clearInterval(timerInterval);
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        secondsLeft--;
        updateTimerDisplay();
        if (secondsLeft <= 0) {
          clearInterval(timerInterval);
          autoPick(teamIndex);
        }
      }, 1000);

      renderPickList();
    }

    function updateTimerDisplay() {
      const m = Math.floor(secondsLeft / 60);
      const s = secondsLeft % 60;
      document.getElementById('timer-display').textContent = `${m}:${s.toString().padStart(2, '0')}`;
    }

    window.draftPlayer = async function(playerIndex) {
      const teamIndex = window.draftOrder[currentPick];
      const player = availablePlayers[playerIndex];
      const pick = { ...player, teamIndex, pickNumber: currentPick };

      clearInterval(timerInterval);

      const draftDoc = await getDoc(doc(db, "drafts", leagueId));
      const existingPicks = draftDoc.data().picks || [];
      await setDoc(doc(db, "drafts", leagueId), {
        ...draftDoc.data(),
        picks: [...existingPicks, pick],
        currentPick: currentPick + 1
      });
    }

    async function autoPick(teamIndex) {
      const positionNeeds = ['QB', 'RB', 'WR', 'TE', 'K'];
      for (const pos of positionNeeds) {
        const idx = availablePlayers.findIndex(p => p.position === pos);
        if (idx !== -1) { await window.draftPlayer(idx); return; }
      }
      if (availablePlayers.length > 0) await window.draftPlayer(0);
    }

    function populateTeamFilter() {
      const teamNames = [...new Set(availablePlayers.map(p => p.team))].sort();
      const select = document.getElementById('draft-team-filter');
      select.innerHTML = '<option value="">All Teams</option>';
      teamNames.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        select.appendChild(opt);
      });
    }

    window.filterDraftPlayers = function() {
      const search = (document.getElementById('draft-search')?.value || '').toLowerCase();
      const pos = document.getElementById('draft-pos-filter')?.value || '';
      const conf = document.getElementById('draft-conf-filter')?.value || '';
      const team = document.getElementById('draft-team-filter')?.value || '';

      const filtered = availablePlayers.filter(p => {
        const name = `${p.firstName} ${p.lastName}`.toLowerCase();
        return (
          (!search || name.includes(search)) &&
          (!pos || p.position === pos) &&
          (!conf || p.conference === conf) &&
          (!team || p.team === team)
        );
      });

      const tbody = document.getElementById('draft-player-body');
      tbody.innerHTML = '';
      filtered.slice(0, 100).forEach(p => {
        const actualIndex = availablePlayers.indexOf(p);
        const row = document.createElement('tr');
        row.innerHTML = `
          <td style="font-weight:600;">${p.firstName} ${p.lastName}</td>
          <td style="color:#6b7280;">${p.position}</td>
          <td style="color:#6b7280;">${p.team}</td>
          <td style="color:#6b7280;">${p.conference}</td>
          <td><button class="btn-sign" onclick="draftPlayer(${actualIndex})">Sign</button></td>
        `;
        tbody.appendChild(row);
      });
    }

    function renderAvailablePlayers() { window.filterDraftPlayers(); }

    function renderPickList() {
      const container = document.getElementById('pick-list');
      container.innerHTML = '';
      const start = Math.max(0, currentPick - 3);
      const end = Math.min(totalPicks, currentPick + 15);

      for (let i = start; i < end; i++) {
        const teamIndex = window.draftOrder[i];
        const round = Math.floor(i / teamCount) + 1;
        const pick = (i % teamCount) + 1;
        const div = document.createElement('div');
        div.className = i === currentPick ? 'pick-chip current' : 'pick-chip';
        div.innerHTML = `<span class="pick-label">R${round}P${pick}</span><span class="pick-team">${teams[teamIndex]?.name || ''}</span>`;
        container.appendChild(div);
      }
    }

    function renderMyRoster() {
      const myTeamIndex = 0;
      const team = teams[myTeamIndex];
      if (!team) return;
      document.getElementById('my-roster-title').textContent = `${team.name}`;

      const slots = league.roster === 'Superflex'
        ? [
            { label: 'QB', positions: ['QB'] },
            { label: 'RB', positions: ['RB'] },
            { label: 'RB', positions: ['RB'] },
            { label: 'WR', positions: ['WR'] },
            { label: 'WR', positions: ['WR'] },
            { label: 'TE', positions: ['TE'] },
            { label: 'Flex', positions: ['RB', 'WR', 'TE'] },
            { label: 'Flex', positions: ['RB', 'WR', 'TE'] },
            { label: 'Superflex', positions: ['QB', 'RB', 'WR', 'TE'] },
            { label: 'K', positions: ['K'] },
            { label: 'D/ST', positions: ['DST'] },
            ...Array(7).fill(null).map(() => ({ label: 'Bench', positions: ['QB', 'RB', 'WR', 'TE', 'K'] })),
            ...Array(2).fill(null).map(() => ({ label: 'MR', positions: ['QB', 'RB', 'WR', 'TE', 'K'] })),
          ]
        : [
            { label: 'QB', positions: ['QB'] },
            { label: 'RB', positions: ['RB'] },
            { label: 'RB', positions: ['RB'] },
            { label: 'WR', positions: ['WR'] },
            { label: 'WR', positions: ['WR'] },
            { label: 'TE', positions: ['TE'] },
            { label: 'Flex', positions: ['RB', 'WR', 'TE'] },
            { label: 'Flex', positions: ['RB', 'WR', 'TE'] },
            { label: 'K', positions: ['K'] },
            { label: 'D/ST', positions: ['DST'] },
            ...Array(7).fill(null).map(() => ({ label: 'Bench', positions: ['QB', 'RB', 'WR', 'TE', 'K'] })),
            ...Array(2).fill(null).map(() => ({ label: 'MR', positions: ['QB', 'RB', 'WR', 'TE', 'K'] })),
          ];

      const roster = [...team.roster];
      const filled = new Array(slots.length).fill(null);
      slots.forEach((slot, i) => {
        const idx = roster.findIndex(p => slot.positions.includes(p.position));
        if (idx !== -1) { filled[i] = roster[idx]; roster.splice(idx, 1); }
      });

      const container = document.getElementById('my-roster-slots');
      container.innerHTML = '';
      slots.forEach((slot, i) => {
        const div = document.createElement('div');
        div.className = `roster-slot ${filled[i] ? 'filled' : 'empty'}`;
        div.innerHTML = `
          <span class="slot-label">${slot.label}</span>
          <span class="slot-player">${filled[i] ? `${filled[i].firstName} ${filled[i].lastName}` : '—'}</span>
        `;
        container.appendChild(div);
      });
    }

    function renderRosters() {
      renderMyRoster();
      const container = document.getElementById('roster-display');
      container.innerHTML = '';
      teams.forEach(team => {
        const div = document.createElement('div');
        div.className = 'roster-card';
        div.innerHTML = `
          <h4>${team.name} <span style="font-weight:400;font-size:12px;color:#9ca3af;">${team.manager}</span></h4>
          <ul>
            ${team.roster.map(p => `<li>${p.firstName} ${p.lastName} — ${p.position}</li>`).join('')}
            ${team.roster.length === 0 ? '<li style="color:#9ca3af;">No players yet</li>' : ''}
          </ul>
        `;
        container.appendChild(div);
      });
    }
  </script>
